<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>strukfoto.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="/favicon_io/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Manrope', sans-serif;
        font-weight: 500 !important;
        color: #1A1A1A;
        -webkit-font-smoothing: antialiased;
      }

      body {
        background-color: #F2EFE9;
        display: flex;
        justify-content: center;
        min-height: 100vh;
        padding: 20px 16px;
      }

      .app-container {
        width: 100%;
        max-width: 440px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* Header Section */
      .brand-header {
        container-type: inline-size;
        margin-bottom: 4px;
        width: 100%;
      }

      .brand-title {
        font-size: 24.2cqi;
        font-weight: 800;
        letter-spacing: -0.05em;
        line-height: 0.88;
        margin-bottom: 8px;
        white-space: nowrap;
        display: block;
        width: 100%;
      }

      .brand-subtitle {
        font-size: 0.85rem;
        font-weight: 500;
        opacity: 0.8;
        letter-spacing: -0.01em;
      }

      /* Grid Layout System */
      .control-grid {
        display: flex;
        flex-direction: column;
      }

      .grid-row {
        display: flex;
        border: 1px solid #1A1A1A;
        margin-top: -1px;
        background-color: #F2EFE9;
        position: relative;
      }

      .grid-row:first-child {
        margin-top: 0;
      }

      .grid-col {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px 14px;
        background: transparent;
        border: none;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
        position: relative;
      }

      .grid-col + .grid-col {
        border-left: 1px solid #1A1A1A;
      }

      /* File Input Override */
      input[type="file"] {
        display: none;
      }

      .btn-label {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
        user-select: none;
      }

      .btn-label svg, .grid-col svg {
        width: 16px;
        height: 16px;
        stroke: #1A1A1A;
        fill: none;
        stroke-width: 2;
      }

      /* Dropdown Selects */
      .select-wrapper {
        position: relative;
        width: 100%;
      }

      select {
        width: 100%;
        padding: 12px 36px 12px 14px;
        background-color: #F2EFE9;
        color: #1A1A1A;
        border: none;
        font-size: 0.9rem;
        font-weight: 500;
        appearance: none;
        -webkit-appearance: none;
        cursor: pointer;
        text-align: center;
        text-align-last: center;
      }

      select:focus {
        outline: none;
      }

      /* Recolor native popover options */
      select option {
        background-color: #F2EFE9;
        color: #1A1A1A;
        padding: 8px;
      }

      select option:checked,
      select option:hover {
        background-color: #1A1A1A;
        color: #F2EFE9;
      }

      .select-chevron {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        pointer-events: none;
      }
      /* Checkbox Rows */
      .checkbox-row {
        justify-content: center;
        gap: 10px;
        user-select: none;
        cursor: pointer;
      }

      input[type="checkbox"] {
        display: none;
      }

      .custom-checkbox {
        width: 16px;
        height: 16px;
        border: 1px solid #1A1A1A;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
      }

      input[type="checkbox"]:checked + .custom-checkbox svg {
        display: block;
      }

      .custom-checkbox svg {
        display: none;
        width: 12px;
        height: 12px;
        stroke: #1A1A1A;
        stroke-width: 3;
      }

      /* Text Inputs Block */
      .text-inputs-block {
        flex-direction: column;
        padding: 14px;
        gap: 8px;
        align-items: stretch;
      }

      .text-input-field {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.9rem;
        font-weight: 500;
      }

      .text-input-field label {
        white-space: nowrap;
      }

      .text-input-field input {
        flex: 1;
        border: none;
        background: transparent;
        font-size: 0.9rem;
        font-weight: 600;
        color: #75736F;
        font-family: 'Manrope', sans-serif;
      }

      .text-input-field input:focus {
        outline: none;
        color: #1A1A1A;
      }

      /* Sliders Block */
      .sliders-block {
        flex-direction: column;
        padding: 12px 14px;
        gap: 10px;
        align-items: stretch;
      }

      .slider-field {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 0.9rem;
        font-weight: 500;
      }

      .slider-field label {
        width: 110px;
        flex-shrink: 0;
      }

      .slider-val {
        width: 36px;
        text-align: right;
        font-weight: 600;
        flex-shrink: 0;
      }

      /* Custom Range Slider Styling */
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        background: transparent;
        cursor: pointer;
      }

      input[type="range"]:focus {
        outline: none;
      }

      input[type="range"]::-webkit-slider-runnable-track {
        width: 100%;
        height: 8px;
        border: 1px solid #1A1A1A;
        background: #F2EFE9;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 18px;
        width: 12px;
        background: #1A1A1A;
        margin-top: -6px;
        border-radius: 0;
      }

      input[type="range"]::-moz-range-track {
        width: 100%;
        height: 8px;
        border: 1px solid #1A1A1A;
        background: #F2EFE9;
      }

      input[type="range"]::-moz-range-thumb {
        height: 18px;
        width: 12px;
        background: #1A1A1A;
        border: none;
        border-radius: 0;
      }

      /* Receipt Preview Container Card */
      .preview-card {
        border: 1px solid #1A1A1A;
        background-color: #121212;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .btn-save {
        background-color: #DB7E14;
        color: #1A1A1A;
        border: none;
        border-bottom: 1px solid #1A1A1A;
        padding: 14px;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        text-align: center;
        width: 100%;
        transition: opacity 0.15s ease;
      }

      .btn-save:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .canvas-viewport {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px 16px;
        min-height: 380px;
        background-image: linear-gradient(45deg, #1d1d1d 25%, transparent 25%), linear-gradient(-45deg, #1d1d1d 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #1d1d1d 75%), linear-gradient(-45deg, transparent 75%, #1d1d1d 75%);
        background-size: 16px 16px;
        background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
      }

      #receiptCanvas {
        max-width: 100%;
        height: auto;
        display: block;
      }

      .card-footer-buttons {
        display: flex;
        border-top: 1px solid #1A1A1A;
      }

      .btn-saweria {
        flex: 1.4;
        background-color: #1A1A1A;
        color: #F2EFE9;
        text-decoration: none;
        padding: 12px 10px;
        font-size: 0.72rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        border-right: 1px solid #1A1A1A;
      }

      .btn-saweria span {
        color: #F2EFE9;
      }

      .btn-reset {
        flex: 1;
        background-color: #F2EFE9;
        color: #1A1A1A;
        border: none;
        padding: 12px 10px;
        font-size: 0.78rem;
        font-weight: 600;
        cursor: pointer;
        text-align: center;
      }

      /* Website Footer */
      .site-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 0;
        font-size: 0.8rem;
        font-weight: 500;
      }

      .social-links {
        display: flex;
        gap: 12px;
      }

      .social-links a {
        display: flex;
        align-items: center;
      }

      .social-links svg {
        width: 18px;
        height: 18px;
        fill: #1A1A1A;
      }
    </style>
  </head>
  <body>

    <div class="app-container">

      <!-- Branding Header -->
      <header class="brand-header">
        <h1 class="brand-title">strukfoto.</h1>
        <p class="brand-subtitle">client-sided, cuman di browser kamu. no server.</p>
      </header>

      <!-- Controls Form Grid -->
      <main class="control-grid">

        <!-- Upload / Clear Buttons -->
        <div class="grid-row">
          <div class="grid-col">
            <label for="imageInput" class="btn-label">
              <span>upload fotomu</span>
              <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </label>
            <input type="file" id="imageInput" accept="image/*">
          </div>
          <button id="clearBtn" class="grid-col" disabled>
            <span>hapus foto</span>
            <svg viewBox="0 0 24 24" style="width:14px; height:14px;"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>

        <!-- Aspect Ratio Dropdown -->
        <div class="grid-row">
          <div class="select-wrapper">
            <select id="aspectInput">
              <option value="1:1">ukuran: 1:1 square (1080x1080)</option>
              <option value="9:16">ukuran: 9:16 story (1080x1920)</option>
              <option value="native">ukuran: native paper</option>
            </select>
            <svg class="select-chevron" width="14" height="14" viewBox="0 0 24 24" stroke="#1A1A1A" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>
        </div>

        <!-- Card Background Transparency Checkbox -->
        <div class="grid-row">
          <label for="transparentBgInput" class="grid-col checkbox-row">
            <span>latar transparan?</span>
            <input type="checkbox" id="transparentBgInput">
            <div class="custom-checkbox">
              <svg viewBox="0 0 24 24" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
          </label>
        </div>
        <!-- Receipt Template Preset Select -->
        <div class="grid-row">
          <div class="select-wrapper">
            <select id="layoutSelect">
              <option value="album">tipe struk: album / tracklist</option>
              <option value="grocery">tipe struk: supermarket / grocery</option>
              <option value="airline">tipe struk: airline boarding pass</option>
              <option value="parking">tipe struk: parking ticket</option>
              <option value="concert">tipe struk: concert / event stub</option>
              <option value="atm">tipe struk: atm / bank slip</option>
            </select>
            <svg class="select-chevron" width="14" height="14" viewBox="0 0 24 24" stroke="#1A1A1A" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>
        </div>
        <!-- Photo Position Dropdown -->
        <div class="grid-row">
          <div class="select-wrapper">
            <select id="imagePosInput">
              <option value="top">layout struk: top (classic)</option>
              <option value="middle">layout struk: middle</option>
              <option value="bottom">layout struk: bottom</option>
              <option value="background">layout struk: background watermark</option>
            </select>
            <svg class="select-chevron" width="14" height="14" viewBox="0 0 24 24" stroke="#1A1A1A" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>
        </div>

        <!-- Text Inputs Block -->
        <div class="grid-row text-inputs-block">
          <div class="text-input-field">
            <label>judul struk:</label>
            <input type="text" id="headerTitle" value="STRUKFOTO">
          </div>
          <div class="text-input-field">
            <label>subjudul struk:</label>
            <input type="text" id="headerSub" value="THE ALBUM RECEIPT">
          </div>

          <!-- Dynamic Section Header -->
          <div class="text-input-field" style="grid-column: 1 / -1; margin-top: 8px;">
            <label id="itemSectionTitle" style="font-weight: bold; text-transform: uppercase;">TRACKLIST ITEMS</label>
          </div>

          <div class="text-input-field">
            <input type="text" class="track-input" value="01. STARGAZING - TRAVIS SCOTT">
          </div>
          <div class="text-input-field">
            <input type="text" class="track-input" value="02. BLINDING LIGHTS - THE WEEKND">
          </div>
          <div class="text-input-field">
            <input type="text" class="track-input" value="03. REDRUM - 21 SAVAGE">
          </div>
          <div class="text-input-field">
            <input type="text" class="track-input" value="04. MIDNIGHT CITY - M83">
          </div>
          <div class="text-input-field">
            <input type="text" class="track-input" value="05. FE!N - TRAVIS SCOTT">
          </div>
        </div>

        <!-- Sliders Block -->
        <div class="grid-row sliders-block">
          <div class="slider-field">
            <label>resolusi (px):</label>
            <input type="range" id="widthInput" min="280" max="1920" step="10" value="450">
            <span class="slider-val" id="widthVal">450</span>
          </div>
          <div class="slider-field">
            <label>kontras:</label>
            <input type="range" id="contrastInput" min="0.5" max="3.5" step="0.1" value="1.8">
            <span class="slider-val" id="contrastVal">1.8</span>
          </div>
          <div class="slider-field">
            <label>terang:</label>
            <input type="range" id="brightnessInput" min="0.5" max="2.0" step="0.1" value="1.0">
            <span class="slider-val" id="brightVal">1</span>
          </div>
        </div>

        <!-- Dither Mode Dropdown -->
        <div class="grid-row">
          <div class="select-wrapper">
            <select id="ditherInput">
              <option value="bayer8">mode dither: bayer 8x8</option>
              <option value="bayer4">mode dither: bayer 4x4</option>
              <option value="threshold">mode dither: simple threshold</option>
            </select>
            <svg class="select-chevron" width="14" height="14" viewBox="0 0 24 24" stroke="#1A1A1A" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>
        </div>

        <!-- Color Palette Dropdown -->
        <div class="grid-row">
          <div class="select-wrapper">
            <select id="paletteInput">
              <option value="cream">tema warna struk: classic cream</option>
              <option value="aged">tema warna struk: aged yellow</option>
              <option value="blue">tema warna struk: blue thermal</option>
              <option value="bw">tema warna struk: stark b&w</option>
            </select>
            <svg class="select-chevron" width="14" height="14" viewBox="0 0 24 24" stroke="#1A1A1A" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>
        </div>

        <!-- Receipt Element Transparency Dropdown -->
        <div class="grid-row">
          <div class="select-wrapper">
            <select id="transparencyInput">
              <option value="none">mode transparan si struk: solid (paper + ink)</option>
              <option value="paper">mode transparan si struk: transparent paper</option>
              <option value="ink">mode transparan si struk: transparent ink</option>
            </select>
            <svg class="select-chevron" width="14" height="14" viewBox="0 0 24 24" stroke="#1A1A1A" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>
        </div>

        <!-- Glitches Slider -->
        <div class="grid-row sliders-block">
          <div class="slider-field">
            <label>glitches:</label>
            <input type="range" id="dropoutsInput" min="0" max="0.05" step="0.002" value="0.012">
            <span class="slider-val" id="dropoutsVal">0.012</span>
          </div>
        </div>

        <!-- Tear Edge Checkbox -->
        <div class="grid-row">
          <label for="tearInput" class="grid-col checkbox-row">
            <span>pinggir kertas bergerigi?</span>
            <input type="checkbox" id="tearInput" checked>
            <div class="custom-checkbox">
              <svg viewBox="0 0 24 24" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
          </label>
        </div>

      </main>

      <!-- Preview Container Card -->
      <div class="preview-card">
        <button id="downloadBtn" class="btn-save" disabled>simpan struk</button>

        <div class="canvas-viewport">
          <canvas id="receiptCanvas"></canvas>
        </div>

        <div class="card-footer-buttons">
          <a href="https://saweria.co/rayyanekaputra" target="_blank" class="btn-saweria">
            <span>support rayyan dengan kopi? cek saweria</span>
          </a>
          <button id="resetBtn" class="btn-reset">reset filter</button>
        </div>
      </div>

      <!-- Site Footer -->
      <footer class="site-footer">
        <span>proudly developed by rayyanekaputra.</span>
        <div class="social-links">
          <a href="https://instagram.com/rayyanekaputra" target="_blank" aria-label="Instagram">

          </a>
          <a href="https://linkedin.com/in/rayyan-eka-putra" aria-label="LinkedIn" target="_blank" >
            <svg viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
          </a>
          <a href="https://x.com/rayyanekaputra" aria-label="Twitter" target="_blank" >
            <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          </a>
        </div>
      </footer>

    </div>
<script type="module" src="./core_logic.js"></script>
