<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thermal Receipt Filter</title>
</head>
<body>
  <h1>Thermal Receipt Generator</h1>

  <div>
    <label>Select Image: <input type="file" id="imageInput" accept="image/*"></label>
    <button id="clearBtn" disabled>Clear Image</button>
  </div>
  <br>

  <!-- Controls -->
  <div>
    <label>Print Width (px): <input type="range" id="widthInput" min="200" max="800" value="450"> <span id="widthVal">450</span></label>
  </div>
  <div>
    <label>Contrast: <input type="range" id="contrastInput" min="0.5" max="3.5" step="0.1" value="1.7"> <span id="contrastVal">1.7</span></label>
  </div>
  <div>
    <label>Brightness: <input type="range" id="brightnessInput" min="0.5" max="2.0" step="0.1" value="1.0"> <span id="brightVal">1.0</span></label>
  </div>
  <div>
    <label>Dither Mode:
      <select id="ditherInput">
        <option value="bayer8">Bayer 8x8</option>
        <option value="bayer4">Bayer 4x4</option>
        <option value="threshold">Simple Threshold</option>
      </select>
    </label>
  </div>
  <div>
    <label>Color Palette:
      <select id="paletteInput">
        <option value="cream">Classic Cream</option>
        <option value="aged">Aged Yellow</option>
        <option value="blue">Blue Thermal</option>
        <option value="bw">Stark B&W</option>
      </select>
    </label>
  </div>
  <div>
    <label>Transparency Mode:
      <select id="transparencyInput">
        <option value="none">Solid (Paper + Ink)</option>
        <option value="paper">Transparent Paper (Ink Only)</option>
        <option value="ink">Transparent Ink (Paper Only)</option>
      </select>
    </label>
  </div>
  <div>
    <label>Dead Pin Glitches: <input type="range" id="dropoutsInput" min="0" max="0.05" step="0.002" value="0.015"> <span id="dropoutsVal">0.015</span></label>
  </div>
  <div>
    <label><input type="checkbox" id="tearInput" checked> Serrated Tear Edge</label>
  </div>
  <br>

  <div>
    <button id="resetBtn">Reset Controls</button>
    <button id="downloadBtn" disabled>Download PNG</button>
  </div>
  <br>

  <!-- Dual Image Preview Section -->
  <div style="display: flex; gap: 20px; align-items: flex-start;">
    <div>
      <h3>Original Preview</h3>
      <img id="inputPreview" style="max-width: 400px; display: none;" alt="Original Upload Preview">
    </div>

    <div>
      <h3>Thermal Receipt Output</h3>
      <canvas id="receiptCanvas" style="background-image: linear-gradient(45deg, #ccc 25%, transparent 25%), linear-gradient(-45deg, #ccc 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #ccc 75%), linear-gradient(-45deg, transparent 75%, #ccc 75%); background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0px;"></canvas>
    </div>
  </div>

  <script>
    const DEFAULTS = {
      width: '450',
      contrast: '1.7',
      brightness: '1.0',
      dither: 'bayer8',
      palette: 'cream',
      transparency: 'none',
      dropouts: '0.015',
      tear: true
    };

    const PALETTES = {
      cream: { paper: [242, 239, 233], ink: [32, 32, 30] },
      aged:  { paper: [235, 222, 190], ink: [50, 42, 35] },
      blue:  { paper: [240, 244, 248], ink: [25, 40, 90] },
      bw:    { paper: [255, 255, 255], ink: [0, 0, 0] }
    };

    const BAYER_4X4 = [
      [ 0,  8,  2, 10],
      [12,  4, 14,  6],
      [ 3, 11,  1,  9],
      [15,  7, 13,  5]
    ];

    const BAYER_8X8 = [
      [ 0, 32,  8, 40,  2, 34, 10, 42],
      [48, 16, 56, 24, 50, 18, 58, 26],
      [12, 44,  4, 36, 14, 46,  6, 38],
      [60, 28, 52, 20, 62, 30, 54, 22],
      [ 3, 35, 11, 43,  1, 33,  9, 41],
      [51, 19, 59, 27, 49, 17, 57, 25],
      [15, 47,  7, 39, 13, 45,  5, 37],
      [63, 31, 55, 23, 61, 29, 53, 21]
    ];

    const elements = {
      imageInput: document.getElementById('imageInput'),
      clearBtn: document.getElementById('clearBtn'),
      inputPreview: document.getElementById('inputPreview'),
      widthInput: document.getElementById('widthInput'),
      widthVal: document.getElementById('widthVal'),
      contrastInput: document.getElementById('contrastInput'),
      contrastVal: document.getElementById('contrastVal'),
      brightnessInput: document.getElementById('brightnessInput'),
      brightVal: document.getElementById('brightVal'),
      ditherInput: document.getElementById('ditherInput'),
      paletteInput: document.getElementById('paletteInput'),
      transparencyInput: document.getElementById('transparencyInput'),
      dropoutsInput: document.getElementById('dropoutsInput'),
      dropoutsVal: document.getElementById('dropoutsVal'),
      tearInput: document.getElementById('tearInput'),
      resetBtn: document.getElementById('resetBtn'),
      downloadBtn: document.getElementById('downloadBtn'),
      canvas: document.getElementById('receiptCanvas')
    };

    const ctx = elements.canvas.getContext('2d');
    let loadedImage = null;
    let cachedDeadRows = [];
    let lastHeight = 0;

    function updateLabels() {
      elements.widthVal.textContent = elements.widthInput.value;
      elements.contrastVal.textContent = elements.contrastInput.value;
      elements.brightVal.textContent = elements.brightnessInput.value;
      elements.dropoutsVal.textContent = elements.dropoutsInput.value;
    }

    function render() {
      if (!loadedImage) return;
      updateLabels();

      const printWidth = parseInt(elements.widthInput.value, 10);
      const printHeight = Math.round((loadedImage.height / loadedImage.width) * printWidth);
      const contrast = parseFloat(elements.contrastInput.value);
      const brightness = parseFloat(elements.brightnessInput.value);
      const ditherMode = elements.ditherInput.value;
      const palette = PALETTES[elements.paletteInput.value] || PALETTES.cream;
      const transparencyMode = elements.transparencyInput.value;
      const dropoutDensity = parseFloat(elements.dropoutsInput.value);
      const showTear = elements.tearInput.checked;

      const offCanvas = document.createElement('canvas');
      offCanvas.width = printWidth;
      offCanvas.height = printHeight;
      const offCtx = offCanvas.getContext('2d');
      offCtx.drawImage(loadedImage, 0, 0, printWidth, printHeight);

      const srcData = offCtx.getImageData(0, 0, printWidth, printHeight).data;

      elements.canvas.width = printWidth;
      elements.canvas.height = printHeight;
      const outImgData = ctx.createImageData(printWidth, printHeight);
      const out = outImgData.data;

      const numDropouts = Math.floor(printHeight * dropoutDensity);
      if (lastHeight !== printHeight || cachedDeadRows.length !== numDropouts) {
        const rows = new Set();
        while (rows.size < numDropouts && numDropouts > 0) {
          rows.add(Math.floor(Math.random() * printHeight));
        }
        cachedDeadRows = Array.from(rows);
        lastHeight = printHeight;
      }

      for (let y = 0; y < printHeight; y++) {
        const isDeadRow = cachedDeadRows.includes(y);

        for (let x = 0; x < printWidth; x++) {
          const idx = (y * printWidth + x) * 4;

          if (showTear) {
            const toothSize = 12;
            const toothDepth = 6;
            const toothY = Math.floor(Math.abs(Math.sin((x / toothSize) * Math.PI)) * toothDepth);
            if (y < toothY || y >= (printHeight - toothDepth + toothY)) {
              out[idx + 3] = 0;
              continue;
            }
          }

          if (isDeadRow) {
            if (transparencyMode === 'paper') {
              out[idx + 3] = 0;
            } else {
              out[idx]     = palette.paper[0];
              out[idx + 1] = palette.paper[1];
              out[idx + 2] = palette.paper[2];
              out[idx + 3] = 255;
            }
            continue;
          }

          const r = srcData[idx];
          const g = srcData[idx + 1];
          const b = srcData[idx + 2];
          let norm = ((r * 0.299 + g * 0.587 + b * 0.114) / 255.0) * brightness;

          norm = (norm - 0.5) * contrast + 0.5;
          norm = Math.min(1.0, Math.max(0.0, norm));

          let threshold = 0.5;
          if (ditherMode === 'bayer4') {
            threshold = BAYER_4X4[y % 4][x % 4] / 16.0;
          } else if (ditherMode === 'bayer8') {
            threshold = BAYER_8X8[y % 8][x % 8] / 64.0;
          }

          const isPaper = norm > threshold;

          if (isPaper) {
            if (transparencyMode === 'paper') {
              out[idx + 3] = 0;
            } else {
              out[idx]     = palette.paper[0];
              out[idx + 1] = palette.paper[1];
              out[idx + 2] = palette.paper[2];
              out[idx + 3] = 255;
            }
          } else {
            if (transparencyMode === 'ink') {
              out[idx + 3] = 0;
            } else {
              out[idx]     = palette.ink[0];
              out[idx + 1] = palette.ink[1];
              out[idx + 2] = palette.ink[2];
              out[idx + 3] = 255;
            }
          }
        }
      }

      ctx.putImageData(outImgData, 0, 0);
      elements.downloadBtn.disabled = false;
      elements.clearBtn.disabled = false;
    }

    // Reset All Control Sliders & Inputs to Defaults
    elements.resetBtn.addEventListener('click', () => {
      elements.widthInput.value = DEFAULTS.width;
      elements.contrastInput.value = DEFAULTS.contrast;
      elements.brightnessInput.value = DEFAULTS.brightness;
      elements.ditherInput.value = DEFAULTS.dither;
      elements.paletteInput.value = DEFAULTS.palette;
      elements.transparencyInput.value = DEFAULTS.transparency;
      elements.dropoutsInput.value = DEFAULTS.dropouts;
      elements.tearInput.checked = DEFAULTS.tear;

      updateLabels();
      if (loadedImage) render();
    });

    // Clear Uploaded File and Reset Previews
    elements.clearBtn.addEventListener('click', () => {
      elements.imageInput.value = '';
      elements.inputPreview.src = '';
      elements.inputPreview.style.display = 'none';
      loadedImage = null;

      ctx.clearRect(0, 0, elements.canvas.width, elements.canvas.height);
      elements.canvas.width = 0;
      elements.canvas.height = 0;

      elements.downloadBtn.disabled = true;
      elements.clearBtn.disabled = true;
    });

    elements.imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        elements.inputPreview.src = event.target.result;
        elements.inputPreview.style.display = 'block';

        const img = new Image();
        img.onload = () => {
          loadedImage = img;
          render();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    [
      elements.widthInput,
      elements.contrastInput,
      elements.brightnessInput,
      elements.ditherInput,
      elements.paletteInput,
      elements.transparencyInput,
      elements.dropoutsInput,
      elements.tearInput
    ].forEach(input => {
      input.addEventListener('input', render);
    });

    elements.downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'thermal-receipt.png';
      link.href = elements.canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
